# Full six-pack for the vanilla-CLJS static-site migration.
# The migration is an architectural shift (drop React/Reagami, generate
# static HTML) with dependency-direction and parity concerns, so we use the
# full chain: specifier -> coder -> cleaner -> architect -> hardender -> QA.
window specifier adapter master
window coder adapter coder
window cleaner adapter cleaner batch
window architect adapter architect batch
window hardender adapter hardender batch
window QA adapter QA batch
